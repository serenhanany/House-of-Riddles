behaviors:
  HintBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0001
      beta: 0.05
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 4
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:  # Optional: Adding intrinsic reward to encourage exploration
        strength: 0.03
        gamma: 0.99
    max_steps: 2000000
    time_horizon: 256
    summary_freq: 10000
